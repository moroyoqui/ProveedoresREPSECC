name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_call:        # lo reutiliza deploy.yml como gate previo al build

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Tesseract y poppler son dependencias nativas de pytesseract/pdf2image;
      # sin ellas los tests de OCR fallan al importar.
      - name: Dependencias del sistema (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng poppler-utils

      - name: Instalar backend
        run: pip install -e "./backend[dev]"

      # Informativo: el gate de despliegue son los tests, no el estilo. Quitar
      # continue-on-error cuando el código esté limpio de ruff.
      - name: Ruff
        continue-on-error: true
        run: ruff check backend/src backend/tests

      # Los tests levantan MySQL 8 con testcontainers; el runner ya trae Docker.
      # Se ejecutan desde la raíz porque conftest resuelve backend/alembic.ini
      # con rutas relativas al repo.
      - name: Pytest
        # Settings exige APP_SECRET (>=16 chars); en local sale del .env de la
        # raíz, que no se versiona. Las DB_* las inyecta conftest desde el
        # contenedor de MySQL.
        # UPLOAD_ROOT apunta por defecto a /var/repse/uploads, que sólo existe
        # dentro del contenedor de la app; en el runner se usa un temporal.
        env:
          APP_ENV: local
          APP_SECRET: ci-secret-not-used-in-production
          UPLOAD_ROOT: ${{ runner.temp }}/repse-uploads
        run: |
          mkdir -p "$UPLOAD_ROOT"
          pytest backend/tests
