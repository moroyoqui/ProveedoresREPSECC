[project]
name = "repse-backend"
version = "0.1.0"
description = "Backend for ProveedoresREPSECC SaaS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "cryptography>=42",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "Pillow>=10",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20",
    "sentry-sdk[fastapi]>=2.0",
    "passlib[argon2]>=1.7",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "faker>=24.0",
    "testcontainers[mysql]>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/repse"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "pdf2image.*", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests requiring MySQL",
    "e2e: end-to-end tests requiring full stack",
    "performance: performance tests (slow)",
]
